name: ClaudeWatch
options:
  bundleIdPrefix: pl.stroniarz.claudewatch
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ONLY_ACTIVE_ARCH: true
    DEVELOPMENT_TEAM: 6FS27R7XXZ
    CODE_SIGN_STYLE: Automatic

targets:
  ClaudeWatch:
    type: application
    platform: iOS
    sources:
      - path: "ClaudeWatch iOS"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.stroniarz.claudewatch
        INFOPLIST_FILE: "ClaudeWatch iOS/Info.plist"
        PRODUCT_NAME: Agent Watch
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - target: ClaudeWatchWatch
        embed: true

  ClaudeWatchWatch:
    type: application
    platform: watchOS
    sources:
      - path: "ClaudeWatch watchOS"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.stroniarz.claudewatch.watchkitapp
        INFOPLIST_FILE: "ClaudeWatch watchOS/Info.plist"
        PRODUCT_NAME: Agent Watch
        GENERATE_INFOPLIST_FILE: false
        SUPPORTS_MACCATALYST: false
        ARCHS: "arm64 arm64e arm64_32"
        "EXCLUDED_ARCHS[sdk=watchsimulator*]": arm64e

  StroniarzVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StroniarzVoiceTests
      - path: Shared/StroniarzVoice
        excludes:
          - "Intents/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.stroniarz.claudewatch.voicetests
        GENERATE_INFOPLIST_FILE: true

schemes:
  ClaudeWatch:
    build:
      targets:
        ClaudeWatch: all
        ClaudeWatchWatch: all
    run:
      config: Debug
    test:
      targets:
        - StroniarzVoiceTests
  ClaudeWatchWatch:
    build:
      targets:
        ClaudeWatchWatch: all
    run:
      config: Debug
      executable: ClaudeWatchWatch
